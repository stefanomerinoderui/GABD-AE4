version: '3.8'
services:
  db:
    image: postgres:19
    container_name: mi_postgres
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password_seguro
      POSTGRES_DB: base_datos_distribuida
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
