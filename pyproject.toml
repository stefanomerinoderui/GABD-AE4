[project]
name = "logistica-federal"
version = "0.1.0"
description = "AE4 - Gestión Avanzada de Bases de Datos: clúster distribuido de Logística Federal"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# E501: el formateador ya parte el código; quedan cadenas largas (SQL, CQL, textos de
# ayuda) que partirlas en varias líneas empeoraría la legibilidad.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Los notebooks son material didáctico: SQL en cadenas largas, alias cortos, etc.
"notebooks/*" = ["E402", "E731", "N817"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["integracion: requiere el clúster levantado (python tareas.py up)"]
