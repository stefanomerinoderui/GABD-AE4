# Archivado continuo de WAL: base del PITR y del RPO de 15 minutos.
# archive_timeout fuerza el cierre del segmento cada 900 s aunque no se llene,
# por lo que nunca quedan más de 15 minutos de transacciones sin archivar.
archive_mode = on
archive_timeout = 900
archive_command = 'mkdir -p /backups/$CLUSTER_BACKUP/wal && test ! -f /backups/$CLUSTER_BACKUP/wal/%f && cp %p /backups/$CLUSTER_BACKUP/wal/%f'
