# Configuración común a todos los nodos OLTP.

# --- Replicación ---
wal_level = logical                 # requerido por la replicación lógica del catálogo
hot_standby_feedback = on           # requerido para sincronizar slots en el standby
sync_replication_slots = on         # el standby copia los slots lógicos (failover de suscripciones)
max_prepared_transactions = 20      # habilita two-phase commit (PREPARE TRANSACTION)

# --- Recuperación (WAL / checkpoints) ---
checkpoint_timeout = 5min
max_wal_size = 1GB
log_checkpoints = on                # deja evidencia de cada checkpoint en el log
summarize_wal = on                  # requerido por los backups incrementales

# --- Observabilidad ---
log_line_prefix = '%m [%p] %q%u@%d '
log_replication_commands = on
